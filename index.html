<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071d3a">
<title>Grazie di cuore</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; }
  body {
    display:grid;
    place-items:center;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 42%, #164f74 0%, #0b3155 35%, #071d3a 72%, #041326 100%);
    color:white;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap {
    text-align:center;
    padding:32px 24px;
    animation: appear .55s ease-out both, disappear .45s ease-in 1.55s forwards;
  }
  .heart {
    font-size:54px;
    line-height:1;
    margin-bottom:18px;
    filter: drop-shadow(0 5px 16px rgba(255,40,70,.28));
    animation: beat .8s ease-in-out 2;
  }
  h1 {
    margin:0;
    font-size:clamp(34px, 9vw, 70px);
    letter-spacing:.02em;
    font-weight:800;
    text-shadow:0 3px 18px rgba(0,0,0,.25);
  }
  .sub {
    margin-top:14px;
    opacity:.88;
    font-size:clamp(15px, 4vw, 21px);
  }
  @keyframes appear {
    from { opacity:0; transform:translateY(10px) scale(.98); }
    to { opacity:1; transform:none; }
  }
  @keyframes disappear {
    to { opacity:0; transform:scale(1.02); }
  }
  @keyframes beat {
    0%,100% { transform:scale(1); }
    50% { transform:scale(1.13); }
  }
</style>
<script>
  setTimeout(function() {
    window.location.replace('https://drive.google.com/file/d/1QWDYTlpNJMasjniwWjV3eXw1b222unz6/view?usp=drivesdk');
  }, 2000);
</script>
</head>
<body>
  <main class="wrap">
    <div class="heart">❤️</div>
    <h1>GRAZIE DI CUORE</h1>
    <div class="sub">Il viaggio continua…</div>
  </main>
</body>
</html>
