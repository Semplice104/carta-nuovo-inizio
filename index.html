<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071d3a">
<title>Carta Nuovo Inizio</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #071d3a;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    overflow-x: hidden;
  }

  #start {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 42%, #164f74 0%, #0b3155 35%, #071d3a 72%, #041326 100%);
    color: white;
    text-align: center;
    padding: 28px;
  }

  #start button {
    border: 0;
    border-radius: 999px;
    padding: 18px 26px;
    font-size: clamp(20px, 6vw, 30px);
    font-weight: 800;
    color: #071d3a;
    background: white;
    box-shadow: 0 14px 40px rgba(0,0,0,.28);
    cursor: pointer;
  }

  #start .hint {
    margin-top: 14px;
    font-size: 15px;
    opacity: .8;
  }

  #intro {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    place-items: center;
    background:
      radial-gradient(circle at 50% 42%, #164f74 0%, #0b3155 35%, #071d3a 72%, #041326 100%);
    color: white;
    text-align: center;
    padding: 28px;
  }

  .intro-wrap {
    animation: introIn .55s ease-out both;
  }

  .heart {
    font-size: 58px;
    line-height: 1;
    margin-bottom: 18px;
    filter: drop-shadow(0 6px 18px rgba(255,55,80,.28));
    animation: beat .8s ease-in-out 3;
  }

  h1 {
    margin: 0;
    font-size: clamp(36px, 10vw, 74px);
    font-weight: 850;
    letter-spacing: .02em;
    text-shadow: 0 3px 18px rgba(0,0,0,.25);
  }

  .sub {
    margin-top: 14px;
    font-size: clamp(15px, 4vw, 22px);
    opacity: .88;
  }

  #card {
    opacity: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #f4efe7;
    transition: opacity .7s ease;
  }

  #card.show { opacity: 1; }

  #card img {
    display: block;
    width: 100%;
    height: auto;
    max-width: 1080px;
    object-fit: contain;
  }

  .fade-out {
    animation: introOut .55s ease-in forwards;
  }

  @keyframes introIn {
    from { opacity: 0; transform: translateY(10px) scale(.98); }
    to { opacity: 1; transform: none; }
  }

  @keyframes introOut {
    to { opacity: 0; visibility: hidden; }
  }

  @keyframes beat {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
</style>
</head>
<body>

<section id="start">
  <div>
    <button id="openBtn">❤️ Tocca per aprire</button>
    <div class="hint">Un ultimo messaggio per te</div>
  </div>
</section>

<section id="intro">
  <div class="intro-wrap">
    <div class="heart">❤️</div>
    <h1>GRAZIE DI CUORE</h1>
    <div class="sub">Il viaggio continua…</div>
  </div>
</section>

<script>
  const start = document.getElementById('start');
  const intro = document.getElementById('intro');
  const card = document.getElementById('card');
  const btn = document.getElementById('openBtn');
  const music = document.getElementById('music');

  btn.addEventListener('click', async () => {
    start.style.display = 'none';
    intro.style.display = 'grid';

    try {
      music.currentTime = 0;
      await music.play();
    } catch (e) {
      // Se il browser blocca comunque l'audio, il saluto visivo continua.
    }

    setTimeout(() => {
      intro.classList.add('fade-out');
      card.classList.add('show');
    }, 3500);

    setTimeout(() => {
      intro.style.display = 'none';
    }, 4100);
  });
</script>
